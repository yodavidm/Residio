<ion-content>
    <app-nav></app-nav>
    <div class="incidencia">

        <div class="title">
            <ion-badge [classList]="claseEstado">{{incidencia.estado}}</ion-badge>
            <h1>{{incidencia.titulo}}</h1>
            <span class="pin">
                <ion-icon name="pin-outline"></ion-icon>
                <p>Estancia: {{incidencia.estancia}}</p>
            </span>
        </div>

        <div class="description">
            <p>
                <strong>Descripción:</strong>
                <br>
                <br>
                {{incidencia.descripcion}}
            </p>
            <br>
            <span class="calendar">
                <ion-icon name="calendar-outline"></ion-icon>
                <p>Creada: {{incidencia.createdAt}}</p>
            </span>
        </div>

        @if (foto) {
        <div class="picture">
            <img src="../../../assets/grifo.jpg" alt="foto">
        </div>
        }
        @else {
        <div class="no-picture">
            <ion-icon name="image-outline"></ion-icon>
            <p>Sin fotografías adjuntas</p>
        </div>
        }


    </div>

</ion-content>
<ion-footer class="footer">
    @if (!resuelto){
    <ion-toolbar>

        <ion-button expand="block" class="add-button" (click)="resolve()">
            <p>Marcar como resuelta</p>
        </ion-button>

    </ion-toolbar>
    }
</ion-footer>
