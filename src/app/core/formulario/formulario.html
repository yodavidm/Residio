<div class="container">
    <form #form="ngForm" (ngSubmit)="registrarAveria(form)">

        <h1>¿Algo da problemas?, coméntalo por aquí</h1>
        <input type="text" name="titulo" [(ngModel)]="averia.titulo" placeholder="Indíca el problema" required>

        <textarea name="descripcion" [(ngModel)]="averia.descripcion" placeholder="Descripción de la avería"
            required></textarea>

        <select name="estancia" [(ngModel)]="averia.estancia" required>
            <option value="" disabled>Selecciona una estancia</option>
            <option value="baño">Baño</option>
            <option value="salon">Salón</option>
            <option value="habitacion">Habitación</option>
            <option value="cocina">Cocina</option>
        </select>

        <div class="upload" (click)="fileInput.click()">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <p>Añadir imagen <br>(opcional)</p>
            <input #fileInput type="file" accept="image/*" hidden (change)="seleccionarFoto($event)">
        </div>
        <button type="submit">Registrar incidencia</button>

    </form>
</div>
