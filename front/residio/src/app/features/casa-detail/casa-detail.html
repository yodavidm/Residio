<ion-content>
    <app-nav></app-nav>
    <div class="detail">

        <ion-card class="sidebar-movil">
            <div class="casa">
                <ion-icon name="home-outline"></ion-icon>
                <div class="casa-movil">
                    <h3>{{casa.direccion}}</h3>
                    <h4>{{casa.inquilinos}} Inquilinos</h4>
                </div>
            </div>

            <ion-item lines="none" class="token-movil" (click)="copyToken()">
                <ion-label>Copiar enlace de acceso</ion-label>
                <ion-icon name="document-text-outline" slot="end"></ion-icon>
            </ion-item>
        </ion-card>

        <div class="main-movil">
            <div class="title-movil">
                <h1>Incidencias</h1>
                <ion-icon name="funnel-outline" id="filtro-incidencias">
                </ion-icon>

                <ion-popover trigger="filtro-incidencias" triggerAction="click" [translucent]="false" side="left"
                    color="light" #popover>
                    <ng-template>
                        <ion-list>
                            <ion-item button (click)="filtrar('Todas', popover)">Todas</ion-item>
                            <ion-item button (click)="filtrar('Pendiente', popover)">Pendientes</ion-item>
                            <ion-item button (click)="filtrar('Resuelta', popover)">Resueltas</ion-item>
                        </ion-list>
                    </ng-template>
                </ion-popover>
            </div>

            @for (incidencia of incidenciasFiltradas; track incidencia.id) {
            <div class="cards-movil" [routerLink]="['incidencia', incidencia.id]">
                <app-casa-detail-card [incidencia]="incidencia"></app-casa-detail-card>
            </div>
            }
        </div>

    </div>
</ion-content>
