<div class="container">
    <form #form="ngForm" (ngSubmit)="registrarIncidencia(form)">

        <h1>¿Algo da problemas?, coméntalo por aquí</h1>
        <input type="text" name="titulo" [(ngModel)]="request.titulo" placeholder="Indíca el problema" required>

        <textarea name="descripcion" [(ngModel)]="request.descripcion" placeholder="Descripción de la incidencia"
            required></textarea>

        <select name="estancia" [(ngModel)]="request.estancia" required>
            <option value="" disabled style="color: #172033;">Selecciona una estancia</option>
            <option value="Baño" style="color: #172033;">Baño</option>
            <option value="Salón" style="color: #172033;">Salón</option>
            <option value="Habitación" style="color: #172033;">Habitación</option>
            <option value="Cocina" style="color: #172033;">Cocina</option>
        </select>

        <div class="upload" (click)="fileInput.click()">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <p>Añadir imagen <br>(opcional)</p>
            <input #fileInput type="file" accept="image/*" hidden (change)="seleccionarFoto($event)">
        </div>
        <button type="submit">Registrar incidencia</button>

    </form>
</div>
