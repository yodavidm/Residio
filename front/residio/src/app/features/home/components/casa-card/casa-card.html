<ion-card button="true" [routerLink]="['casa', casa.id]"> <ion-card-content>
        <ion-item lines="none">
            <ion-label>
                <h2> <ion-icon name="home-outline" slot="start"></ion-icon>
                    {{casa.direccion}}</h2>
                <p><ion-icon name="people-outline"></ion-icon>{{casa.inquilinos}} Inquilinos</p>
            </ion-label>
            @if (pendientes>0){
            <ion-badge><span>+</span> {{pendientes}}</ion-badge>
            }
            <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
        </ion-item>
    </ion-card-content>
</ion-card>
