<ion-toolbar>
    <ion-title><img src="../../../assets/resi-logo.png" alt="logo"> Residio<span>.</span></ion-title>
</ion-toolbar>

<ion-content>
    <div class="home">

        <div class="welcome">
            <p [class]="claseTitulo">{{ mensajeTitulo }}</p>
            <h1>Hola David</h1>
            <span>{{ mensajeIncidencias }}</span>
        </div>
        <ion-button class="add-button">Añadir vivienda</ion-button>

        <div class="section-header">
            <h2>Tus propiedades</h2>
            <span>{{casas.length}} vivienda</span>
        </div>

        <div class="cards">
            @for (casa of casas; track casa.id) {
            <app-casa-card [casa]="casa" [pendientes]="pendientesPorCasa[casa.id] ?? 0"></app-casa-card>
            }
        </div>

    </div>
</ion-content>
